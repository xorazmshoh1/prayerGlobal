name: CI

on:
  push:
    branches: [ "main", "master", "claude/**" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # TZ 10-bo'lim: reklama/billing/analytics SDK'lari bo'lsa build xato bilan to'xtaydi.
      - name: Reklama SDK tekshiruvi
        run: ./gradlew --no-daemon verifyNoAds

      - name: Build va unit testlar
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - name: Test hisobotlari
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
